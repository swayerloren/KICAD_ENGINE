<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KiCad Engine Installer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>KiCad Engine Installer</h1>
          <p id="platformLabel">Detecting platform...</p>
        </div>
        <button id="refreshDepsButton" type="button">Recheck</button>
      </header>

      <section class="panel">
        <div class="section-title">
          <h2>Workspace</h2>
          <span id="payloadStatus">Payload pending</span>
        </div>
        <div class="path-row">
          <input id="workspacePath" type="text" aria-label="Workspace install path">
          <button id="choosePathButton" type="button">Browse</button>
        </div>
        <label class="check-row">
          <input id="openVsCodeCheckbox" type="checkbox" checked>
          <span>Open VS Code after install</span>
        </label>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>Dependencies</h2>
          <span id="dependencySummary">Not checked</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tool</th>
                <th>Status</th>
                <th>Purpose</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="dependencyRows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel actions-panel">
        <button id="installButton" type="button">Create Workspace And Run Health Check</button>
        <button id="openWorkspaceButton" type="button">Open Workspace Folder</button>
      </section>

      <section class="panel log-panel">
        <div class="section-title">
          <h2>Log</h2>
          <span id="installStatus">Idle</span>
        </div>
        <pre id="logOutput"></pre>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
