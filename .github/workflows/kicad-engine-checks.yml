name: KiCad Engine repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - hardening/**
      - github/**

jobs:
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm no KiCad lock files are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files '*.lck' '~*.lck' | grep .; then
            echo "Tracked KiCad lock files found."
            exit 1
          fi

      - name: Confirm no env or obvious secret files are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files '.env' '.env.*' 'secrets.*' 'api_keys.*' 'local_credentials.*' 'private_config.*' | grep .; then
            echo "Tracked env or secret-like files found."
            exit 1
          fi

      - name: Confirm no obvious live secret tokens are tracked
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          patterns = {
              "github_pat": re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              "ghp_token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              "openai_like": re.compile(r"\bsk-[A-Za-z0-9]{20,}\b"),
          }
          excluded_suffixes = {".png", ".jpg", ".jpeg", ".gif", ".pdf", ".zip", ".7z", ".rar", ".stp", ".step", ".gbr", ".drl", ".xln"}
          findings = []

          for item in tracked:
              path = Path(item)
              if path.suffix.lower() in excluded_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"{item}: matched {label}")

          if findings:
              raise SystemExit("Tracked obvious secret tokens found:\n" + "\n".join(findings))
          print("SECRET_PATTERN_SCAN_PASS")
          PY

      - name: Confirm no accidental manufacturing outputs are tracked
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.gbr", "*.drl", "*.xln", "*.step", "*.stp", "*.zip", "*.7z", "*.rar"],
              text=True,
          ).splitlines()
          approved_prefixes = (
              "32_OPEN_KICAD_SAMPLE_INTAKE/normalized_samples/",
          )
          bad = [path for path in tracked if not path.replace("\\", "/").startswith(approved_prefixes)]
          if bad:
              raise SystemExit("Tracked manufacturing or release artifact files found outside approved sample paths:\n" + "\n".join(bad))
          print("MANUFACTURING_ARTIFACT_ALLOWLIST_PASS")
          PY

      - name: Confirm no excluded local-only folders are tracked
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          allowlisted_files = {
              "03_TOOLS/node_envs/README.md",
              "03_TOOLS/python_envs/README.md",
              "03_TOOLS/repos/README.md",
              "03_TOOLS/tool_logs/README.md",
              "99_BACKUPS/README.md",
              "99_BACKUPS/INDEX.md",
              "04_KICAD_PROJECTS/active/ESP32_CSI_WIFI_NODE/routing_work/README.md",
              "04_KICAD_PROJECTS/active/ESP32_CSI_WIFI_NODE/routing_rehearsals/README.md",
          }
          legacy_prefix_allowlist = (
              "04_KICAD_PROJECTS/active/ESP32_CSI_WIFI_NODE/routing_work/20260508_091428/",
          )
          bad = []
          for path in tracked:
              normalized = path.replace("\\", "/")
              if normalized in allowlisted_files:
                  continue
              if normalized.startswith(legacy_prefix_allowlist):
                  continue
              if normalized.startswith("03_TOOLS/node_envs/"):
                  bad.append(path)
              elif normalized.startswith("03_TOOLS/python_envs/"):
                  bad.append(path)
              elif normalized.startswith("03_TOOLS/repos/"):
                  bad.append(path)
              elif normalized.startswith("03_TOOLS/tool_logs/"):
                  bad.append(path)
              elif normalized.startswith("99_BACKUPS/") or normalized.startswith("T_E_M_P/"):
                  bad.append(path)
              elif "/routing_work/" in normalized and "/copied" not in normalized and normalized != "04_KICAD_PROJECTS/active/ESP32_CSI_WIFI_NODE/routing_work/README.md":
                  bad.append(path)
              elif "/routing_work/" in normalized and "/copied" in normalized:
                  bad.append(path)
              elif "/routing_rehearsals/" in normalized:
                  bad.append(path)
              elif "/imported_originals/" in normalized:
                  bad.append(path)
          if bad:
              raise SystemExit("Tracked local-only paths found:\n" + "\n".join(bad))
          print("REPO_HYGIENE_PASS")
          PY
