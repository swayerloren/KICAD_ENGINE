name: Create Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing draft release tag, for example v0.6.0-draft. The workflow refuses missing tags."
        required: true
      release_name:
        description: "Draft release title."
        required: false
        default: "KiCad Engine Draft Release"

permissions:
  contents: write
  actions: read

jobs:
  windows:
    uses: ./.github/workflows/build-installer-windows.yml

  macos:
    uses: ./.github/workflows/build-installer-macos.yml

  linux:
    uses: ./.github/workflows/build-installer-linux.yml

  draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
      - linux

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Assemble release assets
        run: |
          mkdir -p release-artifacts
          for file in \
            KiCad-Engine-Setup-Windows-x64.exe \
            KiCad-Engine-Setup-macOS-universal.dmg \
            KiCad-Engine-Setup-Linux-x64.AppImage \
            KiCad-Engine-Setup-Linux-amd64.deb \
            KICAD_ENGINE_PAYLOAD.zip
          do
            found="$(find downloaded-artifacts -type f -name "$file" | sort | head -n 1 || true)"
            if [ -z "$found" ]; then
              echo "Missing release artifact: $file" >&2
              exit 1
            fi
            cp "$found" "release-artifacts/$file"
          done
          find downloaded-artifacts -type f \( -name '*.log' -o -name 'PAYLOAD_BUILD_REPORT-*.md' \) -print0 |
            while IFS= read -r -d '' log_file; do
              cp "$log_file" "release-artifacts/$(basename "$log_file")"
            done
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum |
              sed 's#  \./#  #' > SHA256SUMS.txt
          )

      - name: Write draft release notes
        run: |
          cat > release-notes.md <<'EOF'
          # KiCad Engine Draft Release

          This is a draft release generated by GitHub Actions.

          ## Included Assets

          - `KiCad-Engine-Setup-Windows-x64.exe`
          - `KiCad-Engine-Setup-macOS-universal.dmg`
          - `KiCad-Engine-Setup-Linux-x64.AppImage`
          - `KiCad-Engine-Setup-Linux-amd64.deb`
          - `KICAD_ENGINE_PAYLOAD.zip`
          - `SHA256SUMS.txt`
          - Build logs and payload build reports

          ## Safety Notes

          - This workflow creates a draft release only.
          - It does not publish the release.
          - It does not add secrets or require paid services.
          - AI-assisted review is not fabrication approval.
          - Validate installer signatures, checksums, payload contents, and clean-machine smoke tests before publishing.
          EOF

      - name: Create GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null
          gh release create "$TAG_NAME" release-artifacts/* \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md
